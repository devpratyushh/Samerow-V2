<svg xmlns="http://www.w3.org/2000/svg" width="920" height="282" viewBox="0 0 920 282" role="img" aria-labelledby="title desc">
  <title id="title">What to copy from the SameRow pairing panel</title>
  <desc id="desc">Copy the gateway and token lines to the server's .env.pilot file.</desc>
  <rect width="920" height="282" rx="20" fill="#181b20"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="49" font-size="27" font-weight="700" fill="#fff">Copy the two connector settings</text>
    <text x="32" y="84" font-size="17" fill="#c5d0df">On SameRow Web, click Pair Docker connector.</text>
    <rect x="32" y="108" width="480" height="112" rx="12" fill="#242a33" stroke="#59677b"/>
    <rect x="592" y="108" width="296" height="112" rx="12" fill="#283747" stroke="#6e9aca"/>
    <g fill="#fff" font-size="19" font-weight="700">
      <text x="52" y="141">Docker connector settings</text>
      <text x="612" y="148">On your server</text>
    </g>
    <g fill="#c5d0df" font-size="16">
      <text x="52" y="170" font-family="monospace">SAMEROW_CONNECTOR_GATEWAY=…</text>
      <text x="52" y="195" font-family="monospace">SAMEROW_CONNECTOR_TOKEN=…</text>
      <text x="612" y="177">Paste both lines into .env.pilot</text>
      <text x="32" y="256">Keep the connector token private. Send friends the room invite from SameRow Local.</text>
    </g>
    <path d="M525 164h51m-10-8 10 8-10 8" fill="none" stroke="#a5caff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
